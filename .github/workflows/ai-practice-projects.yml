name: AI practice projects
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check worked examples
        run: python3 learning-projects/run_all.py --reference
      - name: Check downloadable archive matches source
        run: python3 scripts/check_practice_archive.py
