name: MELA Android mobile browser smoke

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-mobile:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated Playwright runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Exercise published MELA on Pixel mobile Chromium
        env:
          MELA_APP_URL: https://melakulms.github.io/mela-app/
          MELA_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/android-mobile-smoke.mjs
      - name: Keep mobile screenshot for authorized inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mela-mobile-navigation-check
          path: android-smoke-artifacts/
          retention-days: 3
