name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_MELA_BUILD_SHA: ${{ github.sha }}
          VITE_SUPABASE_URL: https://duizgtmbptmlbyipreqg.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_flQNx6AE3_dbPDHfYGNwWQ_7cMSsAng
      - name: Verify new Home and role selector are in the compiled release
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/sw.js
          grep -R -F -q "Back to MELA Home" dist/assets
          grep -R -F -q "Account type (required)" dist/assets
          grep -R -F -q "Create your MELA account" dist/assets
          grep -R -F -q "No invitation code?" dist/assets
          grep -R -F -q "Open free study library" dist/assets
          grep -R -F -q "Try interactive practice" dist/assets
          grep -R -F -q "Scholarship research is not an offer" dist/assets
          grep -R -F -q "Installed app version" dist/assets
          grep -R -F -q "Open Career Passport updates" dist/assets
          grep -R -F -q "Request record verification" dist/assets
          grep -R -F -q "Career Passport · Production protection update" dist/assets
          grep -R -F -q "Check latest MELA version" dist/assets
          # The 2026-10-29 free mentorship guidance release must reach the actual phone app.
          grep -R -F -q "Mentorship learning resources" dist/assets
          grep -R -F -q "MELA Mentorship — 16 Sections" dist/assets
          grep -R -F -q "16 mentorship section cards" dist/assets
          grep -R -F -q "PRACTICE ONLY" dist/assets
          grep -R -F -q "Showing saved public guides" dist/assets
          grep -R -F -q "Add education" dist/assets
          printf '{"commit":"%s","published_from":"github-actions"}\n' "$GITHUB_SHA" > dist/mela-release.json
          test -s dist/mela-release.json
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_URL: https://melakulms.github.io/mela-app/
      SUPABASE_URL: https://duizgtmbptmlbyipreqg.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_flQNx6AE3_dbPDHfYGNwWQ_7cMSsAng
    steps:
      - uses: actions/checkout@v4
      - name: Verify published learner app
        run: bash scripts/production-smoke.sh app
      - name: Confirm this exact build reached the phone-facing URL
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..15}; do
            content="$(curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://melakulms.github.io/mela-app/mela-release.json?check=${GITHUB_SHA}" || true)"
            if [[ "$content" == *"${GITHUB_SHA}"* ]]; then
              echo "Verified MELA release: ${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The latest MELA commit was not visible on GitHub Pages."
          exit 1
      - name: Verify Supabase Auth health
        run: bash scripts/production-smoke.sh auth
      - name: Verify launch-critical Auth settings
        run: bash scripts/production-smoke.sh auth-settings
      - name: Verify zero-budget beta authentication
        run: bash scripts/production-smoke.sh beta-auth
      - name: Verify live Telegram registration code webhook
        run: bash scripts/production-smoke.sh telegram-registration
      - name: Verify Supabase Data API
        run: bash scripts/production-smoke.sh data
      - name: Verify anonymous account and reviewer privacy
        run: bash scripts/production-smoke.sh privacy
      - name: Verify published practice download
        run: |
          curl -fSL --retry 3 --max-time 30 "https://melakulms.github.io/mela-app/ai-practice-projects-v1.zip?check=${GITHUB_SHA}" -o /tmp/mela-practice.zip
          cmp public/ai-practice-projects-v1.zip /tmp/mela-practice.zip
