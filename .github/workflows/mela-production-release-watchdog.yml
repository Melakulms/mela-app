name: MELA production Pages release watchdog

# GitHub API-driven updates can merge without starting a Pages push run.
# A lightweight check repairs mismatched releases; no redeploy if current.
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mela-pages-release-watchdog
  cancel-in-progress: false

jobs:
  check-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact production release commit
        id: check
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "Melakulms/mela-app" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production watchdog only runs on Melakulms/mela-app main"
            exit 1
          fi
          marker="$RUNNER_TEMP/mela-pages-release.json"
          url="https://melakulms.github.io/mela-app/mela-release.json?watchdog=$EXPECTED_SHA"
          if ! status="$(curl --silent --show-error --location --max-time 20 --retry 2 \
              -H 'Cache-Control: no-cache' --output "$marker" --write-out '%{http_code}' "$url")"; then
            echo "::error::Cannot safely determine production release; refusing blind deployment"
            exit 1
          fi
          if [[ "$status" != '200' && "$status" != '404' ]]; then
            echo "::error::Unexpected production marker HTTP status $status; refusing blind deployment"
            exit 1
          fi
          deployed=""
          if [[ "$status" == "200" ]]; then
            deployed="$(jq -r '.commit // empty' "$marker" 2>/dev/null || true)"
          fi
          if [[ "$deployed" == "$EXPECTED_SHA" ]]; then
            echo "Production Pages already serves main $EXPECTED_SHA"
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Production Pages marker differs from main. Current: $deployed; expected: $EXPECTED_SHA"
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch verified GitHub Pages publishing workflow
        if: steps.check.outputs.needs_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # workflow_dispatch is exempt from GITHUB_TOKEN recursion prevention.
          curl --fail-with-body --silent --show-error --retry 2 \
            -X POST "https://api.github.com/repos/Melakulms/mela-app/actions/workflows/deploy.yml/dispatches" \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"ref":"main"}'
          echo "Requested deployment; existing deploy.yml build, privacy and SHA smoke gates still apply."
