name: Mentorship assignments regression checks

on:
  pull_request:
    branches:
      - feature/mentorship-foundation-20261027
    paths:
      - 'src/components/MentorshipLearningWorkspace.tsx'
      - 'src/lib/mentorship-workspace.ts'
      - 'tests/mentorship-assignment-workflow.test.tsx'
      - '.github/workflows/mentorship-assignment-tests.yml'

permissions:
  contents: read

jobs:
  assignments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Check assignment and revision flows
        run: npx vitest run tests/mentorship-assignment-workflow.test.tsx
      - name: Typecheck and create production bundle
        run: npm run build
