name: Mentorship staging preview HTTP smoke
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check staged preview HTML and JavaScript asset from outside Vercel
        env:
          PREVIEW_URL: https://mela-staging-fxo7fqkn0-melakuanteneh1-gmailcoms-projects.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          status=''
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -L -sS --max-time 20 -o /tmp/mela-staging.html -w '%{http_code}' "$PREVIEW_URL/" || true)
            if [[ "$status" == 200 ]] && grep -q '<div id="root"></div>' /tmp/mela-staging.html; then
              break
            fi
            sleep 7
          done
          echo "Preview root HTTP status: $status"
          [[ "$status" == 200 ]]
          grep -q '<div id="root"></div>' /tmp/mela-staging.html
          grep -q 'tungqfmypuwzeyrtaseh.supabase.co' /tmp/mela-staging.html
          ! grep -q 'duizgtmbptmlbyipreqg.supabase.co' /tmp/mela-staging.html
          script=$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/mela-staging.html | head -1 | cut -d '"' -f2)
          [[ "$script" == /assets/* ]]
          asset_status=$(curl -L -sS --max-time 20 -o /tmp/mela-script.js -w '%{http_code}' "$PREVIEW_URL$script")
          echo "JavaScript asset HTTP status: $asset_status"
          [[ "$asset_status" == 200 ]]
          test -s /tmp/mela-script.js
          ! head -c 200 /tmp/mela-script.js | grep -qi '<html'
          echo 'External staging preview root, CSP, and compiled JavaScript asset verified.'
