name: Check learner changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build public offline app without production secrets
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_test
      - name: Verify public offline assets exist
        run: |
          test -s dist/offline.html
          test -s dist/ai-year-one.html
          test -s dist/offline-progress.js
          test -s dist/sw.js
      - name: Confirm production build CSP excludes staging
        run: |
          grep -F -q 'https://duizgtmbptmlbyipreqg.supabase.co' dist/index.html
          ! grep -F -q 'https://tungqfmypuwzeyrtaseh.supabase.co' dist/index.html
      - name: Build staging with isolated API origins
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://tungqfmypuwzeyrtaseh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_test
          VITE_MELA_STAGING: 'true'
      - name: Confirm staging build CSP excludes production
        run: |
          grep -F -q "connect-src 'self' https://tungqfmypuwzeyrtaseh.supabase.co wss://tungqfmypuwzeyrtaseh.supabase.co;" dist/index.html
          ! grep -F -q 'https://duizgtmbptmlbyipreqg.supabase.co' dist/index.html
