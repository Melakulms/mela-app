name: MELA STAGING Learner Security and Build
on:
  push:
    branches: [staging/learner-20261020]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learner-staging-verify
  cancel-in-progress: true

jobs:
  staging-verify:
    if: github.ref == 'refs/heads/staging/learner-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Local learner role and navigation tests (no production network)
        run: npm test
      - name: Build isolated staging learner app
        run: npm run build
        env:
          VITE_MELA_STAGING: 'true'
          VITE_SUPABASE_URL: https://tungqfmypuwzeyrtaseh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GHvo0PVvPVP9oo8qaslUmA_reIC-6TT
      - name: Verify staged artifacts and environment isolation
        run: node scripts/staging-learner-safety.mjs
        env:
          VITE_MELA_STAGING: 'true'
          VITE_SUPABASE_URL: https://tungqfmypuwzeyrtaseh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GHvo0PVvPVP9oo8qaslUmA_reIC-6TT
      - name: Read-only live staging backend checks
        run: node scripts/staging-learner-readonly-smoke.mjs
        env:
          VITE_MELA_STAGING: 'true'
          VITE_SUPABASE_URL: https://tungqfmypuwzeyrtaseh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GHvo0PVvPVP9oo8qaslUmA_reIC-6TT
      - name: Install independent Playwright mobile runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mela-staging-mobile"
          npm install --prefix "$RUNNER_TEMP/mela-staging-mobile" --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          ln -s "$RUNNER_TEMP/mela-staging-mobile/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/mela-staging-mobile/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test staged login and offline resources on Android-sized Chromium
        run: node scripts/staging-learner-mobile.mjs
        env:
          MELA_MOBILE_STAGING: 'true'
          VITE_MELA_STAGING: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mela-learner-staging-mobile
          path: android-staging-artifacts/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: mela-learner-staging-site
          path: dist/
          retention-days: 7
